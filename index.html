<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fb">
  <title>سهام</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8l1.6 2.3 2.8-.6.9 2.7 2.6 1.2-.7 2.8L21 13.4l-2 2 .3 2.9-2.8.5L15 21.3l-2.6-1.3L9.7 21.3 8.4 18.8l-2.8-.5.3-2.9-2-2 1.8-2.2-.7-2.8 2.6-1.2.9-2.7 2.8.6z" stroke-linejoin="round"/></g></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></g></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 19L18 6M18 6h-8M18 6v8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.1 1.7-1.9 3.1-3.1 5.3-3.1 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></g></symbol>
    <symbol id="i-lens" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M7.5 10.5h6M11.5 8l2 2.5-2 2.5"/></g></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></g></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M3.5 18l5.5-5 4 3.5 3-2.5 4.5 4"/></g></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-14 15-15-1 10-7 15-15 15z"/><path d="M5 19c3-4 6-7 10-9"/></g></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></g></symbol>
    <symbol id="i-paw" viewBox="0 0 24 24"><g fill="currentColor"><ellipse cx="5.6" cy="10.4" rx="2.2" ry="2.8" transform="rotate(-18 5.6 10.4)"/><ellipse cx="9.6" cy="5.8" rx="2.2" ry="2.9"/><ellipse cx="14.4" cy="5.8" rx="2.2" ry="2.9"/><ellipse cx="18.4" cy="10.4" rx="2.2" ry="2.8" transform="rotate(18 18.4 10.4)"/><path d="M12 11c-3 0-6.6 4.4-6.6 7 0 2 1.8 3 3.5 3 1.3 0 2.1-.6 3.1-.6s1.8.6 3.1.6c1.7 0 3.5-1 3.5-3 0-2.6-3.6-7-6.6-7z"/></g></symbol>
    <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 22c4.4 0 7-2.9 7-6.6 0-3.9-3-6.2-4-9.9-.4 2.1-1.4 3.3-2.6 4C12.6 6.4 10.6 3.5 8 2c.4 3.9-3 6.7-3 11.3C5 18.9 7.6 22 12 22z"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12.6" r="10" fill="#d98a00"/><circle cx="12" cy="11.4" r="10" fill="#ffc531"/><circle cx="12" cy="11.4" r="7" fill="#ffd95e" stroke="#e8a200" stroke-width="1.4"/><path d="M9.2 13.6l2.8-5 2.8 5h-1.9v2h-1.8v-2z" fill="#e39500"/><ellipse cx="8.6" cy="7.4" rx="2.4" ry="1.2" fill="#fff6c9" opacity=".8" transform="rotate(-30 8.6 7.4)"/></symbol>
    <symbol id="i-shop" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16l-1.2 10.2a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8z"/><path d="M8.5 9V7a3.5 3.5 0 0 1 7 0v2"/></g></symbol>
    <symbol id="i-chest" viewBox="0 0 24 24"><path d="M3 10h18v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="#b5651d"/><path d="M3 10a5 5 0 0 1 5-5h8a5 5 0 0 1 5 5z" fill="#d9822b"/><path d="M3 10h18v2.4H3z" fill="#ffc531"/><path d="M8 5v16M16 5v16" stroke="#ffc531" stroke-width="1.8"/><rect x="10" y="9" width="4" height="5.5" rx="1" fill="#fff3b0" stroke="#8a4b10" stroke-width=".8"/></symbol>
  </defs>
</svg>

<div id="app">

  <!-- ===== الرئيسية ===== -->
  <section class="screen active" id="home">
    <div class="home-top">
      <button class="stat-pill coin-pill" data-go="shop"><svg class="ico"><use href="#i-coin"/></svg><b id="h-coins">0</b><i class="plus">+</i></button>
      <div class="stat-pill"><svg class="ico star"><use href="#i-star"/></svg><b id="h-stars">0</b></div>
      <div class="stat-pill hide-sm"><svg class="ico"><use href="#i-image"/></svg><b id="h-pics">0</b></div>
      <span class="grow"></span>
      <button class="icon-btn" data-go="settings" aria-label="settings"><svg class="ico"><use href="#i-gear"/></svg></button>
    </div>

    <div class="logo">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64"><g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
          <path d="M14 50V30h16V14" stroke="var(--ink)"/><path d="M23 18l7-7 7 7" stroke="var(--ink)"/>
          <path d="M34 50h16V34" stroke="var(--accent)"/><path d="M43 38l7-7 7 7" stroke="var(--accent)" transform="rotate(0)"/>
        </g></svg>
      </div>
      <h1 data-i18n="appName">سهام</h1>
      <p class="tagline" data-i18n="tagline"></p>
      <div class="rank" id="h-rank"></div>
    </div>

    <div class="mystery">
      <canvas id="h-mystery" width="160" height="160"></canvas>
      <div class="mystery-label"><span data-i18n="nextPic"></span><b>؟</b></div>
      <button class="chest-bar" id="h-chest"><svg class="ico chest-ic"><use href="#i-chest"/></svg><span class="cb-track"><span class="cb-fill" id="h-chest-fill"></span></span><small id="h-chest-txt"></small></button>
    </div>

    <button class="btn-primary big" id="btn-play">
      <span data-i18n="play"></span>
      <small id="h-level"></small>
    </button>

    <div class="mode-row">
      <button class="mode-card" id="btn-daily">
        <svg class="ico"><use href="#i-cal"/></svg>
        <span data-i18n="daily"></span>
        <small id="h-daily"></small>
      </button>
      <button class="mode-card" id="btn-zen">
        <svg class="ico"><use href="#i-leaf"/></svg>
        <span data-i18n="zen"></span>
        <small data-i18n="zenSub"></small>
      </button>
      <button class="mode-card pack-card" id="btn-pack">
        <i class="card-new" data-i18n="newBadge"></i>
        <svg class="ico"><use href="#i-paw"/></svg>
        <span data-i18n="pack"></span>
        <small id="h-pack"></small>
      </button>
    </div>

    <nav class="bottom-nav">
      <button data-go="levels"><svg class="ico"><use href="#i-grid"/></svg><span data-i18n="levels"></span></button>
      <button data-go="gallery"><svg class="ico"><use href="#i-image"/></svg><span data-i18n="gallery"></span></button>
      <button data-go="shop" class="nav-shop"><svg class="ico"><use href="#i-shop"/></svg><span data-i18n="shop"></span><i class="dot hidden" id="shop-dot"></i></button>
      <button data-go="settings"><svg class="ico"><use href="#i-gear"/></svg><span data-i18n="settings"></span></button>
    </nav>
  </section>

  <!-- ===== اللعب ===== -->
  <section class="screen" id="game">
    <header class="bar">
      <button class="icon-btn" id="g-back" aria-label="back"><svg class="ico flip"><use href="#i-back"/></svg></button>
      <h2 id="g-title"></h2>
      <button class="icon-btn" id="g-restart" aria-label="restart"><svg class="ico"><use href="#i-restart"/></svg></button>
    </header>
    <div class="g-stats">
      <div class="chip" id="g-left-chip"><svg class="ico sm"><use href="#i-arrow"/></svg><b id="g-left">0</b></div>
      <div class="hearts" id="g-hearts"></div>
      <div class="chip" id="g-diff"></div>
    </div>
    <div class="progress"><div class="bar-fill" id="g-bar"></div><span id="g-pct"></span><span class="streak" id="g-streak"></span></div>
    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div class="glow" id="glow"></div>
      <div class="fx" id="fx"></div>
      <div class="coach hidden" id="coach"></div>
      <button class="nudge hidden" id="nudge"><span class="nudge-ic">💡</span><span id="nudge-t"></span></button>
    </div>
    <footer class="tools">
      <button class="tool" id="t-hint"><span class="tool-ic"><svg class="ico"><use href="#i-bulb"/></svg><i class="badge" id="b-hint"></i></span><label data-i18n="hint"></label></button>
      <button class="tool" id="t-lens"><span class="tool-ic"><svg class="ico"><use href="#i-lens"/></svg><i class="badge" id="b-lens"></i></span><label data-i18n="lens"></label></button>
      <button class="tool" id="t-fit"><span class="tool-ic"><svg class="ico"><use href="#i-fit"/></svg></span><label data-i18n="fit"></label></button>
    </footer>
  </section>

  <!-- ===== المراحل ===== -->
  <section class="screen" id="levels">
    <header class="bar">
      <button class="icon-btn" data-go="home" aria-label="back"><svg class="ico flip"><use href="#i-back"/></svg></button>
      <h2 data-i18n="levels"></h2>
      <span class="icon-btn ghost"></span>
    </header>
    <div class="scroll"><div class="level-grid" id="level-grid"></div></div>
  </section>

  <!-- ===== حيوانات من أسهم ===== -->
  <section class="screen" id="pack">
    <header class="bar">
      <button class="icon-btn" data-go="home" aria-label="back"><svg class="ico flip"><use href="#i-back"/></svg></button>
      <h2 data-i18n="packTitle"></h2>
      <span class="icon-btn ghost" id="pack-count"></span>
    </header>
    <p class="sub center" data-i18n="packHint"></p>
    <div class="scroll"><div class="pack-grid" id="pack-grid"></div></div>
  </section>

  <!-- ===== المتجر ===== -->
  <section class="screen" id="shop">
    <header class="bar">
      <button class="icon-btn" data-go="back" aria-label="back"><svg class="ico flip"><use href="#i-back"/></svg></button>
      <h2 data-i18n="shop"></h2>
      <div class="stat-pill coin-pill"><svg class="ico"><use href="#i-coin"/></svg><b id="s-coins">0</b></div>
    </header>
    <p class="sub center" data-i18n="shopHint"></p>
    <div class="seg shop-tabs" id="shop-tabs">
      <button data-v="trail" data-i18n="shopTrails"></button>
      <button data-v="skin" data-i18n="shopSkins"></button>
      <button data-v="tools" data-i18n="shopTools"></button>
    </div>
    <div class="scroll"><div class="shop-grid" id="shop-grid"></div></div>
  </section>

  <!-- ===== المعرض ===== -->
  <section class="screen" id="gallery">
    <header class="bar">
      <button class="icon-btn" data-go="home" aria-label="back"><svg class="ico flip"><use href="#i-back"/></svg></button>
      <h2 data-i18n="gallery"></h2>
      <span class="icon-btn ghost" id="gal-count"></span>
    </header>
    <p class="sub center" data-i18n="galleryHint"></p>
    <div class="scroll"><div class="gal-grid" id="gal-grid"></div></div>
  </section>

  <!-- ===== الإعدادات ===== -->
  <section class="screen" id="settings">
    <header class="bar">
      <button class="icon-btn" data-go="back" aria-label="back"><svg class="ico flip"><use href="#i-back"/></svg></button>
      <h2 data-i18n="settings"></h2>
      <span class="icon-btn ghost"></span>
    </header>
    <div class="scroll settings">
      <div class="set-group">
        <div class="set-label" data-i18n="theme"></div>
        <div class="seg" id="set-theme">
          <button data-v="light" data-i18n="themeLight"></button>
          <button data-v="dark" data-i18n="themeDark"></button>
          <button data-v="sepia" data-i18n="themeSepia"></button>
        </div>
      </div>
      <div class="set-group">
        <div class="set-label" data-i18n="language"></div>
        <div class="seg" id="set-lang">
          <button data-v="ar">العربية</button>
          <button data-v="en">English</button>
        </div>
      </div>
      <label class="set-row"><span data-i18n="music"></span><input type="checkbox" class="switch" id="set-music"></label>
      <label class="set-row"><span data-i18n="sound"></span><input type="checkbox" class="switch" id="set-sound"></label>
      <label class="set-row"><span data-i18n="vibration"></span><input type="checkbox" class="switch" id="set-vibe"></label>
      <label class="set-row"><span><span data-i18n="safeTap"></span><small data-i18n="safeTapSub"></small></span><input type="checkbox" class="switch" id="set-safe"></label>
      <button class="set-row hidden" id="set-privacy"><span data-i18n="privacyOpts"></span><b>›</b></button>
      <a class="set-row" id="set-policy" href="https://muhammedkado.github.io/siham-game/privacy.html" target="_blank" rel="noopener"><span data-i18n="privacyPolicy"></span><b>›</b></a>
      <a class="set-row apk-row hidden" id="set-apk" href="siham.apk" download="siham.apk"><span><span data-i18n="getApk"></span><small data-i18n="getApkSub"></small></span><b>⬇</b></a>
      <button class="btn-danger" id="set-reset" data-i18n="reset"></button>
      <p class="version">Siham 2.2</p>
    </div>
  </section>

  <div class="modal hidden" id="modal"><div class="modal-card" id="modal-card"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script src="js/i18n.js"></script>
<script src="js/pictures.js"></script>
<script src="js/generator.js"></script>
<script src="js/sfx-data.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
